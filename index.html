<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="theme-color" content="#111111">
<title>Courses à deux</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#111;color:#eee;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* iOS : police >=16px sur les champs pour empêcher le zoom auto au focus (PWA) */
input,textarea,select{font-size:16px}
input:focus{outline:none;border-color:#4a7c59!important}
button{cursor:pointer;font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}

.app{min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:100px;position:relative}

.header{position:sticky;top:0;z-index:10;background:rgba(17,17,17,.95);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:calc(12px + env(safe-area-inset-top)) 16px 8px}
.header-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:20px;font-weight:700;letter-spacing:-.5px}
.icon-btn{background:none;border:none;color:#aaa;font-size:20px;padding:4px 8px;border-radius:8px}
.sync-bar{margin-top:4px;font-size:11px;color:#888}
.sync-bar.error{color:#e74c3c}

.search-wrap{padding:8px 16px 4px;position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:9;background:rgba(17,17,17,.95);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.search-box{position:relative}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none}
.search-input{width:100%;padding:8px 12px 8px 32px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.06);color:#eee;font-size:16px;font-family:inherit}

.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);color:#ccc;font-size:13px;white-space:nowrap}
.chip:active{background:rgba(255,255,255,.14)}
.chip .c-count{color:#888;font-size:11px}

.cta-wrap{padding:8px 16px 2px}
.shop-cta{width:100%;padding:13px;border-radius:12px;border:none;background:#4a7c59;color:#fff;font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 2px 14px rgba(74,124,89,.3);display:flex;align-items:center;justify-content:center;gap:8px}
.shop-cta:active{transform:scale(.98)}

.settings{background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.06);padding:8px 16px}
.settings button{display:block;width:100%;background:none;border:none;color:#ccc;font-size:14px;padding:10px 0;text-align:left;border-bottom:1px solid rgba(255,255,255,.06)}
.settings button.danger{color:#e74c3c}

.group-head{display:flex;align-items:center;gap:8px;padding:10px 16px 6px;scroll-margin-top:calc(104px + env(safe-area-inset-top));position:sticky;top:calc(98px + env(safe-area-inset-top));background:rgba(17,17,17,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:5;cursor:pointer;-webkit-user-select:none;user-select:none}
.group-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.group-label{font-size:13px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.5px;flex:1}
.group-count{font-size:11px;color:#666}
.group-chevron{font-size:12px;color:#555;margin-left:6px;transition:transform .2s}
.group-chevron.open{transform:rotate(180deg)}
.group-items{overflow:hidden;transition:max-height .25s ease;max-height:8000px}
.group-items.collapsed{max-height:0!important}

.item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,.04);animation:fadeIn .15s ease}
.item.done-item{opacity:.4}
.checkbox{background:none;border:none;padding:0;flex-shrink:0}
.box{width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.2)}
.box.done{border:none;background:#4a7c59;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.item-content{flex:1;display:flex;align-items:baseline;gap:8px;min-width:0;cursor:pointer}
.item-name{font-size:15px;font-weight:500}
.item-name.strike{text-decoration:line-through}
.item-qty{font-size:12px;color:#888;flex-shrink:0}
.del-btn{background:none;border:none;color:#555;font-size:14px;padding:4px 8px;flex-shrink:0}

.sep{padding:4px 16px 2px;display:flex;align-items:center;gap:8px}
.sep span{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.sep::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.06)}

.empty{text-align:center;padding:80px 20px}

.fab{position:fixed;bottom:28px;right:24px;width:56px;height:56px;border-radius:50%;background:#4a7c59;color:#fff;border:none;font-size:28px;font-weight:300;box-shadow:0 4px 24px rgba(74,124,89,.4);z-index:20;display:flex;align-items:center;justify-content:center}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.modal{background:#1a1a1a;border-radius:20px 20px 0 0;padding:20px 20px 28px;width:100%;max-width:480px;max-height:85vh;overflow:auto;overscroll-behavior:contain;animation:slideUp .25s ease}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.modal-title{font-size:18px;font-weight:700}
.close-btn{background:none;border:none;color:#888;font-size:20px;padding:4px 8px}

.input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#eee;font-size:16px;margin-bottom:10px;font-family:inherit}
.cat-grid{display:flex;gap:6px;overflow-x:auto;position:relative;margin:6px 0 14px;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-grid::-webkit-scrollbar{display:none}
.cat-chip{flex-shrink:0;white-space:nowrap;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#aaa;font-size:13px;text-align:left}
.cat-chip.active{border:none;color:#fff}
.cat-chip.add-new{border:1px dashed rgba(255,255,255,.2);justify-content:center;color:#888}
.primary-btn{width:100%;padding:14px;border-radius:12px;border:none;background:#4a7c59;color:#fff;font-size:16px;font-weight:600;margin-top:4px;font-family:inherit}
.primary-btn:disabled{opacity:.4}

.emoji-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.emoji-btn{font-size:24px;background:none;border:none;padding:4px 8px;border-radius:8px}
.emoji-btn.sel{background:rgba(255,255,255,.15)}
.color-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.color-btn{width:32px;height:32px;border-radius:50%;border:3px solid transparent}
.color-btn.sel{border-color:#fff}

.setup-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.setup-card{background:#1a1a1a;border-radius:20px;padding:28px;max-width:400px;width:100%;text-align:center}
.setup-title{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px}
.setup-sub{color:#888;font-size:13px;margin-bottom:24px}
.setup-box{text-align:left;margin-bottom:16px;padding:12px;background:rgba(255,255,255,.03);border-radius:10px}
.setup-box h3{font-size:14px;font-weight:700;color:#4a7c59;margin-bottom:4px}
.setup-box p{font-size:13px;color:#aaa;line-height:1.5}
.setup-box code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:4px;font-size:13px}
.label{display:block;font-size:12px;color:#888;margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.error-msg{color:#e74c3c;font-size:13px;margin-bottom:8px}

/* ===== Mode Course ===== */
.shop{min-height:100vh;max-width:480px;margin:0 auto;display:flex;flex-direction:column}
.shop-head{position:sticky;top:0;z-index:10;background:rgba(17,17,17,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid rgba(255,255,255,.06)}
.shop-head-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.shop-title{font-size:17px;font-weight:800}
.progress{height:9px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#4a7c59,#6bbf7e);border-radius:9px;transition:width .35s ease}
.progress-label{font-size:12px;color:#aaa;margin-top:7px;display:flex;justify-content:space-between}
.shop-grp{font-size:12px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.5px;padding:18px 18px 6px;display:flex;align-items:center;gap:8px}
.shop-row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.05);min-height:62px;animation:fadeIn .15s ease;-webkit-user-select:none;user-select:none}
.shop-row:active{background:rgba(255,255,255,.05)}
.shop-name{flex:1;font-size:17px;font-weight:600;line-height:1.25}
.shop-qty{font-size:14px;color:#9a9a9a;font-weight:500;flex-shrink:0}
.shop-check{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;transition:all .15s}
.shop-row.taken .shop-check{background:#4a7c59;border-color:#4a7c59;animation:pop .25s ease}
.shop-row.taken .shop-name{text-decoration:line-through;color:#777}
.shop-done-head{padding:16px 18px 10px;font-size:13px;font-weight:700;color:#888;border-top:1px solid rgba(255,255,255,.06);margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.shop-celebrate{text-align:center;padding:64px 24px 12px}
.shop-finish{margin:16px;padding:16px;border-radius:14px;border:none;background:#4a7c59;color:#fff;font-size:16px;font-weight:700;font-family:inherit;width:calc(100% - 32px)}
.shop-finish:active{transform:scale(.98)}
.shop-empty{text-align:center;padding:80px 24px;color:#888}
</style>
</head>
<body>
<div id="app"></div>
<script>
const BASE_CAT=[
{id:"fruits-legumes",label:"Fruits & Légumes",emoji:"🥬",color:"#4a7c59"},
{id:"boucherie",label:"Boucherie & Poissonnerie",emoji:"🥩",color:"#c0392b"},
{id:"cremerie",label:"Crèmerie",emoji:"🧀",color:"#f0c040"},
{id:"epicerie",label:"Épicerie",emoji:"🫙",color:"#b5651d"},
{id:"boulangerie",label:"Boulangerie",emoji:"🥖",color:"#d4a056"},
{id:"surgeles",label:"Surgelés",emoji:"🧊",color:"#5dade2"},
{id:"boissons",label:"Boissons",emoji:"🍷",color:"#8e44ad"},
{id:"hygiene",label:"Hygiène & Beauté",emoji:"🧴",color:"#e8a0bf"},
{id:"maison",label:"Maison & Entretien",emoji:"🏠",color:"#2c7a7b"},
{id:"autre",label:"Autre",emoji:"📦",color:"#7f8c8d"}
];
const EMOJIS=["🐱","🐶","🍕","🎉","💊","🧹","🪴","🍼","🎮","🏋️","📚","🎁"];
const COLORS=["#e67e22","#e74c3c","#3498db","#2ecc71","#9b59b6","#1abc9c","#f39c12","#e84393"];
const VERSION="2026-05-30 · 3";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const now=()=>new Date().toISOString();
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/</g,"&lt;").replace(/>/g,"&gt;");
const vibrate=ms=>{try{navigator.vibrate&&navigator.vibrate(ms||15);}catch(e){}};
const byName=(a,b)=>a.name.localeCompare(b.name,"fr",{sensitivity:"base"});

let S={items:[],cc:[],token:localStorage.getItem("courses_token")||"",gistId:localStorage.getItem("courses_gist_id")||"",syncing:false,lastSync:null,error:"",showAdd:false,showSettings:false,showAddCat:false,shopMode:false,search:"",addName:"",addQty:"",_ac:"epicerie",_ce:EMOJIS[0],_ccl:COLORS[0],_open:{},_shopPanier:false};
let syncT=null,syncDebounce=null,dirty=false,inFlight=false,syncQueued=false,_focus=null,_lastView="";

function cats(){return[...BASE_CAT,...S.cc];}
function liveItems(){return S.items.filter(i=>!i.deleted);}

/* ---------- Fusion sans perte (merge) ---------- */
function mergeItems(a,b){
  const m=new Map();
  for(const it of a)m.set(it.id,it);
  for(const it of b){const e=m.get(it.id);if(!e||(it.updatedAt||"")>(e.updatedAt||""))m.set(it.id,it);}
  return [...m.values()];
}
function mergeCats(a,b){
  const m=new Map();
  for(const c of [...a,...b])if(!m.has(c.id))m.set(c.id,c);
  return [...m.values()];
}
function sig(items){return JSON.stringify((items||[]).map(i=>[i.id,i.name,i.qty,i.category,!!i.checked,!!i.deleted,i.updatedAt||""]).sort());}

/* ---------- GitHub Gist ---------- */
async function gLoad(){
  const r=await fetch(`https://api.github.com/gists/${S.gistId}`,{headers:{Authorization:`Bearer ${S.token}`,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(!r.ok)throw new Error(`GitHub ${r.status}`);
  const g=await r.json();const c=g.files&&g.files["courses.json"]?g.files["courses.json"].content:null;
  return c?JSON.parse(c):{items:[],customCategories:[]};
}
async function gSave(d){
  const r=await fetch(`https://api.github.com/gists/${S.gistId}`,{method:"PATCH",headers:{Authorization:`Bearer ${S.token}`,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({files:{"courses.json":{content:JSON.stringify(d,null,2)}}})});
  if(!r.ok)throw new Error(`GitHub ${r.status}`);
}
function payload(){
  const cutoff=Date.now()-7*864e5; // on purge les suppressions de +7 jours
  const items=S.items.filter(i=>!(i.deleted&&new Date(i.updatedAt||0).getTime()<cutoff));
  return {items,customCategories:S.cc,lastModified:now()};
}

/* ---------- Barre de statut (mise à jour sans rebuild du DOM) ---------- */
function statusText(){
  if(S.error)return{err:true,html:esc(S.error)};
  const items=liveItems();
  const tU=items.filter(i=>!i.checked).length,tD=items.filter(i=>i.checked).length;
  const t=S.syncing?"Synchro...":S.lastSync?"Synchro "+S.lastSync.toLocaleTimeString("fr-FR"):"";
  return{err:false,html:`${t} · ${tU} à prendre${tD>0?" · "+tD+" fait"+(tD>1?"s":""):""}`};
}
function setStatus(){
  const bar=document.getElementById("sync-bar");
  if(bar){const s=statusText();bar.className="sync-bar"+(s.err?" error":"");bar.innerHTML=s.html;}
  const sp=document.getElementById("sync-spin");
  if(sp)sp.style.animation=S.syncing?"spin 1s linear infinite":"";
}

/* ---------- Synchro (lecture -> fusion -> écriture si besoin) ---------- */
// On ne rebuild le DOM (R) QUE si les données ont changé : sinon simple maj du statut,
// pour éviter le "flash" de re-render toutes les 15 s.
async function sync(){
  if(!S.token||!S.gistId)return;
  if(inFlight){syncQueued=true;return;}
  inFlight=true;S.syncing=true;setStatus();
  let changed=false;
  try{
    const remote=await gLoad();
    const before=sig(S.items)+"|"+JSON.stringify(S.cc);
    S.items=mergeItems(S.items,remote.items||[]);
    S.cc=mergeCats(S.cc,remote.customCategories||[]);
    changed=(sig(S.items)+"|"+JSON.stringify(S.cc))!==before;
    if(dirty||sig(S.items)!==sig(remote.items)){await gSave(payload());}
    dirty=false;S.lastSync=new Date();S.error="";
  }catch(e){S.error="Synchro : "+e.message;}
  inFlight=false;S.syncing=false;
  if(changed)R();else setStatus();
  if(syncQueued){syncQueued=false;sync();}
}
function scheduleSync(){dirty=true;clearTimeout(syncDebounce);syncDebounce=setTimeout(sync,700);}
function startSync(){
  sync();
  clearInterval(syncT);
  syncT=setInterval(()=>{
    const ae=document.activeElement;
    if(ae&&/INPUT|TEXTAREA/.test(ae.tagName))return; // pas de re-render pendant la saisie
    if(inFlight)return;
    sync();
  },15000);
}

/* ---------- Mutations ---------- */
function addItem(n,q,c,keepModal){
  S.items.push({id:uid(),name:n,qty:q,category:c,checked:false,deleted:false,addedAt:now(),updatedAt:now()});
  scheduleSync();
  if(keepModal){ // modal ouvert : on vide les champs en place, sans reconstruire (pas de ré-animation)
    S.addName="";S.addQty="";
    const nm=$("#inp-name"),qt=$("#inp-qty");
    if(qt)qt.value="";
    if(nm){nm.value="";nm.focus();}
  }else R();
}
function toggle(id){const i=S.items.find(x=>x.id===id);if(i){i.checked=!i.checked;i.updatedAt=now();vibrate();}scheduleSync();R();}
function del(id){const i=S.items.find(x=>x.id===id);if(i){i.deleted=true;i.checked=false;i.updatedAt=now();}scheduleSync();R();}
function clearDone(){liveItems().filter(i=>i.checked).forEach(i=>{i.deleted=true;i.updatedAt=now();});scheduleSync();R();}
function addCat(l,e,c){const id=l.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]/g,"-");if(cats().find(x=>x.id===id))return id;S.cc.push({id,label:l,emoji:e,color:c});scheduleSync();return id;}

function hl(t,q){if(!q)return esc(t);const lo=t.toLowerCase(),idx=lo.indexOf(q);if(idx===-1)return esc(t);return esc(t.slice(0,idx))+'<mark style="background:#4a7c59;color:#fff;border-radius:2px;padding:0 2px">'+esc(t.slice(idx,idx+q.length))+"</mark>"+esc(t.slice(idx+q.length));}

/* ---------- Render ---------- */
function R(){
  const ok=S.token&&S.gistId;
  const view=!ok?"setup":S.shopMode?"shop":"app";
  const y=(view===_lastView)?window.scrollY:0; // garde le scroll si on reste sur le même écran
  $("#app").innerHTML=ok?(S.shopMode?renderShop():renderApp()):renderSetup();
  _lastView=view;
  bind(ok);
  // Bloque le scroll de l'arrière-plan quand une modale est ouverte
  document.body.style.overflow=(ok&&(S.showAdd||S.showAddCat))?"hidden":"";
  if(_focus){const el=document.getElementById(_focus.id);if(el){el.focus();try{el.setSelectionRange(_focus.start,_focus.end);}catch(e){}}}
  // Centre le rayon sélectionné dans la ligne horizontale (sans bouger la page)
  if(S.showAdd){const ac=document.querySelector(".cat-chip.active");if(ac){const g=ac.parentElement;g.scrollLeft=ac.offsetLeft-g.clientWidth/2+ac.clientWidth/2;}}
  if(!(ok&&(S.showAdd||S.showAddCat)))window.scrollTo(0,y);
}

function renderSetup(){
  return`<div class="setup-wrap"><div class="setup-card">
  <div style="font-size:48px;margin-bottom:8px">🛒</div>
  <h1 class="setup-title">Courses à deux</h1>
  <p class="setup-sub">Configuration unique — tu ne reverras plus cet écran</p>
  <div class="setup-box"><h3>1. Crée un Gist sur GitHub</h3><p>Va sur <strong>gist.github.com</strong>, crée un Gist avec un fichier nommé <code>courses.json</code> contenant <code>{}</code></p></div>
  <div class="setup-box"><h3>2. Génère un token GitHub</h3><p>Settings → Developer settings → Personal access tokens → Fine-grained → permission <strong>Gists: Read & Write</strong></p></div>
  <label class="label">Token GitHub</label><input class="input" type="password" id="inp-token" placeholder="github_pat_...">
  <label class="label">ID du Gist</label><input class="input" id="inp-gist" placeholder="bfcb022b24695a1541f0b481ca9c5023">
  <div id="setup-err"></div>
  <button class="primary-btn" id="btn-setup">C'est parti !</button>
  </div></div>`;
}

function renderApp(){
  const q=S.search.toLowerCase().trim();
  const items=liveItems();
  const fil=q?items.filter(i=>i.name.toLowerCase().includes(q)):items;
  const tU=items.filter(i=>!i.checked).length,tD=items.filter(i=>i.checked).length;

  const grouped=cats().map(c=>{
    const u=fil.filter(i=>!i.checked&&i.category===c.id).sort(byName);
    const d=fil.filter(i=>i.checked&&i.category===c.id).sort(byName);
    return{...c,u,d};
  }).filter(g=>g.u.length>0||g.d.length>0);

  const st=statusText();
  const sync=`<span class="sync-bar${st.err?" error":""}" id="sync-bar">${st.html}</span>`;

  let set=S.showSettings?`<div class="settings"><button id="btn-clear">🗑 Vider les cochés (${tD})</button><button class="danger" id="btn-logout">↪ Déconnecter</button><div style="font-size:11px;color:#555;padding:10px 0 2px">Version ${VERSION}</div></div>`:"";

  let cta=tU>0?`<div class="cta-wrap"><button class="shop-cta" id="btn-shop">🛒 Faire les courses · ${tU} à prendre</button></div>`:"";

  let chips=(!q&&grouped.length>1)?`<div class="chips">${grouped.map(g=>`<button class="chip" data-jump="${g.id}"><span>${g.emoji}</span><span>${esc(g.label.split(/[ &]/)[0])}</span><span class="c-count">${g.u.length}</span></button>`).join("")}</div>`:"";

  let list="";
  if(!grouped.length&&!q)list=`<div class="empty"><div style="font-size:64px;margin-bottom:16px">🛒</div><p style="color:#888;font-size:15px">La liste est vide !</p><p style="color:#666;font-size:13px;margin-top:4px">Appuie sur + pour ajouter</p></div>`;
  else if(!grouped.length&&q)list=`<div class="empty"><p style="color:#888;font-size:15px">Aucun résultat pour « ${esc(q)} »</p></div>`;
  else grouped.forEach(g=>{
    if(S._open[g.id]===undefined)S._open[g.id]=g.u.length>0;
    const isOpen=S._open[g.id];
    list+=`<div class="group-head" id="grp-${g.id}" data-grp="${g.id}"><span class="group-dot" style="background:${g.color}"></span><span class="group-label">${g.emoji} ${esc(g.label)}</span><span class="group-count">${g.u.length}/${g.u.length+g.d.length}</span><span class="group-chevron${isOpen?" open":""}">▼</span></div>`;
    list+=`<div class="group-items${isOpen?"":" collapsed"}">`;
    g.u.forEach(i=>{list+=renderItem(i,q,false);});
    if(g.d.length){
      list+=`<div class="sep"><span>fait${g.d.length>1?"s":""}</span></div>`;
      g.d.forEach(i=>{list+=renderItem(i,q,true);});
    }
    list+=`</div>`;
  });

  let addM=S.showAdd?renderAddModal():"";
  let catM=S.showAddCat?renderCatModal():"";

  return`<div class="app">
  <header class="header"><div class="header-top"><h1 class="logo">🛒 Courses</h1><div style="display:flex;gap:4px"><button class="icon-btn" id="btn-sync"><span id="sync-spin" style="display:inline-block;${S.syncing?"animation:spin 1s linear infinite":""}">⟳</span></button><button class="icon-btn" id="btn-settings">⚙</button></div></div><div>${sync}</div></header>
  <div class="search-wrap"><div class="search-box"><span class="search-icon">🔍</span><input class="search-input" id="inp-search" placeholder="Rechercher..." value="${esc(S.search)}"></div></div>
  ${chips}${cta}${set}<main style="padding:8px 0">${list}</main>
  <button class="fab" id="btn-fab">+</button>${addM}${catM}</div>`;
}

function renderItem(i,q,done){
  return`<div class="item${done?" done-item":""}"><button class="checkbox" data-t="${i.id}"><div class="box${done?" done":""}">${done?"✓":""}</div></button><div class="item-content" data-t="${i.id}"><span class="item-name${done?" strike":""}">${hl(i.name,q)}</span>${i.qty?`<span class="item-qty">${esc(i.qty)}</span>`:""}</div><button class="del-btn" data-d="${i.id}">✕</button></div>`;
}

function renderShop(){
  const items=liveItems();
  const tot=items.length,taken=items.filter(i=>i.checked).length,left=tot-taken;
  const pct=tot?Math.round(taken/tot*100):0;
  const head=`<div class="shop-head">
    <div class="shop-head-top"><span class="shop-title">🛒 En course</span><button class="icon-btn" id="btn-shop-close">✕ Quitter</button></div>
    <div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label"><span>${taken} pris</span><span>${left} restant${left>1?"s":""}</span></div>
  </div>`;

  if(!tot)return`<div class="shop">${head}<div class="shop-empty"><div style="font-size:56px">🛒</div><p style="margin-top:12px">Rien à acheter.<br>Ajoute des articles d'abord.</p></div></div>`;

  let body="";
  if(left===0){
    body=`<div class="shop-celebrate"><div style="font-size:64px">🎉</div><p style="font-size:20px;font-weight:800;margin-top:12px">Tout est pris&nbsp;!</p><p style="color:#888;margin-top:6px">${taken} article${taken>1?"s":""} dans le panier</p></div>
    <button class="shop-finish" id="btn-finish">✅ Terminer &amp; vider la liste</button>`;
  }else{
    const groups=cats().map(c=>({...c,u:items.filter(i=>!i.checked&&i.category===c.id).sort(byName)})).filter(g=>g.u.length);
    groups.forEach(g=>{
      body+=`<div class="shop-grp"><span class="group-dot" style="background:${g.color}"></span>${g.emoji} ${esc(g.label)} · ${g.u.length}</div>`;
      g.u.forEach(i=>{body+=`<div class="shop-row" data-t="${i.id}"><div class="shop-check"></div><span class="shop-name">${esc(i.name)}</span>${i.qty?`<span class="shop-qty">${esc(i.qty)}</span>`:""}</div>`;});
    });
  }

  let panier="";
  const done=items.filter(i=>i.checked).sort(byName);
  if(done.length){
    const open=S._shopPanier;
    panier=`<div class="shop-done-head" id="btn-panier"><span>🧺 Dans le panier (${done.length})</span><span class="group-chevron${open?" open":""}">▼</span></div>`;
    if(open)panier+=done.map(i=>`<div class="shop-row taken" data-t="${i.id}"><div class="shop-check">✓</div><span class="shop-name">${esc(i.name)}</span>${i.qty?`<span class="shop-qty">${esc(i.qty)}</span>`:""}</div>`).join("");
  }

  return`<div class="shop">${head}<div style="flex:1">${body}${panier}</div></div>`;
}

function renderAddModal(){
  const cs=cats();
  return`<div class="overlay" id="ov"><div class="modal">
  <div class="modal-head"><h2 class="modal-title">Ajouter un article</h2><button class="close-btn" id="btn-cm">✕</button></div>
  <input class="input" id="inp-name" placeholder="Ex: Tomates, Lait..." value="${esc(S.addName)}">
  <input class="input" id="inp-qty" placeholder="Quantité (optionnel) : 500g, x3..." value="${esc(S.addQty)}">
  <label class="label">Rayon</label>
  <div class="cat-grid">${cs.map(c=>`<button class="cat-chip${S._ac===c.id?" active":""}" data-cat="${c.id}" style="${S._ac===c.id?`background:${c.color};color:#fff;border:none`:""}">${c.emoji} <span style="font-size:12px">${esc(c.label)}</span></button>`).join("")}<button class="cat-chip add-new" id="btn-nc">＋ Catégorie</button></div>
  <button class="primary-btn" id="btn-ai">Ajouter</button>
  </div></div>`;
}

function renderCatModal(){
  return`<div class="overlay" id="ov2"><div class="modal">
  <div class="modal-head"><h2 class="modal-title">Nouvelle catégorie</h2><button class="close-btn" id="btn-cc">✕</button></div>
  <input class="input" id="inp-cn" placeholder="Nom de la catégorie">
  <label class="label">Emoji</label>
  <div class="emoji-grid">${EMOJIS.map(e=>`<button class="emoji-btn${S._ce===e?" sel":""}" data-e="${e}">${e}</button>`).join("")}</div>
  <label class="label">Couleur</label>
  <div class="color-grid">${COLORS.map(c=>`<button class="color-btn${S._ccl===c?" sel":""}" data-cl="${c}" style="background:${c}"></button>`).join("")}</div>
  <button class="primary-btn" id="btn-sc">Créer la catégorie</button>
  </div></div>`;
}

function bind(ok){
  if(!ok){
    $("#btn-setup")?.addEventListener("click",async()=>{
      const t=$("#inp-token").value.trim(),g=$("#inp-gist").value.trim();
      if(!t||!g)return;S.token=t;S.gistId=g;
      try{await gLoad();localStorage.setItem("courses_token",t);localStorage.setItem("courses_gist_id",g);startSync();R();}
      catch(e){$("#setup-err").innerHTML=`<p class="error-msg">Impossible de se connecter. Vérifie ton token et l'ID du Gist.</p>`;S.token="";S.gistId="";}
    });return;
  }

  // Mode Course
  $("#btn-shop")?.addEventListener("click",()=>{S.shopMode=true;S.showSettings=false;_focus=null;R();});
  $("#btn-shop-close")?.addEventListener("click",()=>{S.shopMode=false;_focus=null;R();});
  $("#btn-finish")?.addEventListener("click",()=>{clearDone();S.shopMode=false;});
  $("#btn-panier")?.addEventListener("click",()=>{S._shopPanier=!S._shopPanier;R();});

  // Header
  $("#inp-search")?.addEventListener("input",e=>{S.search=e.target.value;_focus={id:"inp-search",start:e.target.selectionStart,end:e.target.selectionEnd};R();});
  $("#btn-sync")?.addEventListener("click",sync);
  $("#btn-settings")?.addEventListener("click",()=>{S.showSettings=!S.showSettings;_focus=null;R();});
  $("#btn-clear")?.addEventListener("click",clearDone);
  $("#btn-logout")?.addEventListener("click",()=>{clearInterval(syncT);clearTimeout(syncDebounce);localStorage.removeItem("courses_token");localStorage.removeItem("courses_gist_id");S.token="";S.gistId="";S.items=[];S.cc=[];S.showSettings=false;dirty=false;_focus=null;R();});
  $("#btn-fab")?.addEventListener("click",()=>{S.showAdd=true;S._ac="epicerie";S.addName="";S.addQty="";_focus={id:"inp-name",start:0,end:0};R();});

  // Add modal
  $("#ov")?.addEventListener("click",e=>{if(e.target.id==="ov"){S.showAdd=false;_focus=null;R();}});
  $("#btn-cm")?.addEventListener("click",()=>{S.showAdd=false;_focus=null;R();});
  $("#inp-name")?.addEventListener("input",e=>{S.addName=e.target.value;});
  $("#inp-qty")?.addEventListener("input",e=>{S.addQty=e.target.value;});
  document.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{S._ac=b.dataset.cat;_focus={id:"inp-name",start:S.addName.length,end:S.addName.length};R();}));
  $("#btn-ai")?.addEventListener("click",()=>{
    const n=($("#inp-name")?.value||"").trim(),q=($("#inp-qty")?.value||"").trim();
    if(!n)return;
    addItem(n,q,S._ac||"epicerie",true); // garde le modal ouvert (pas de bruit)
    const btn=$("#btn-ai");
    if(btn){btn.textContent="Ajouté ✓";setTimeout(()=>{const b=$("#btn-ai");if(b)b.textContent="Ajouter";},700);}
  });
  $("#inp-name")?.addEventListener("keydown",e=>{if(e.key==="Enter")$("#btn-ai")?.click();});
  $("#inp-qty")?.addEventListener("keydown",e=>{if(e.key==="Enter")$("#btn-ai")?.click();});

  // New category
  $("#btn-nc")?.addEventListener("click",()=>{S.showAdd=false;S.showAddCat=true;S._ce=EMOJIS[0];S._ccl=COLORS[0];_focus=null;R();});
  $("#ov2")?.addEventListener("click",e=>{if(e.target.id==="ov2"){S.showAddCat=false;S.showAdd=true;R();}});
  $("#btn-cc")?.addEventListener("click",()=>{S.showAddCat=false;S.showAdd=true;R();});
  document.querySelectorAll("[data-e]").forEach(b=>b.addEventListener("click",()=>{S._ce=b.dataset.e;R();}));
  document.querySelectorAll("[data-cl]").forEach(b=>b.addEventListener("click",()=>{S._ccl=b.dataset.cl;R();}));
  $("#btn-sc")?.addEventListener("click",()=>{const n=$("#inp-cn")?.value.trim();if(!n)return;const id=addCat(n,S._ce,S._ccl);S.showAddCat=false;S.showAdd=true;S._ac=id;R();});

  // Accordéon : on bascule la classe directement (animation fluide, pas de rebuild = pas de flash)
  document.querySelectorAll("[data-grp]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.grp,open=!S._open[id];S._open[id]=open;
    const gi=b.nextElementSibling,ch=b.querySelector(".group-chevron");
    if(gi)gi.classList.toggle("collapsed",!open);
    if(ch)ch.classList.toggle("open",open);
  }));

  // Puces de catégories : saute au rayon (le déplie au passage)
  document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
    const id=b.dataset.jump,head=document.getElementById("grp-"+id);
    if(!head)return;
    if(S._open[id]===false){
      S._open[id]=true;
      const gi=head.nextElementSibling,ch=head.querySelector(".group-chevron");
      if(gi)gi.classList.remove("collapsed");
      if(ch)ch.classList.add("open");
    }
    head.scrollIntoView({behavior:"smooth",block:"start"});
  }));

  // Cocher / supprimer (commun mode normal + mode course)
  document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>toggle(b.dataset.t)));
  document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();del(b.dataset.d);}));
}

// Synchro immédiate quand on revient sur l'app ou qu'on repasse en ligne
// (sync() ne fait rien si pas connecté) -> les deux voient vite les changements de l'autre
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!inFlight)sync();});
window.addEventListener("online",()=>{if(!inFlight)sync();});

R();
if(S.token&&S.gistId)startSync();
</script>
</body>
</html>
